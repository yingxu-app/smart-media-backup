name: Android release APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-preview-release

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v1
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          cache-dependency-path: mobile/pnpm-lock.yaml
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android project
        run: pnpm exec expo prebuild --no-install --platform android
      - name: Build release APK
        run: cd android && ./gradlew --no-daemon assembleRelease
      - name: Inspect APK
        run: |
          ls -l android/app/build/outputs/apk/release/
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E "index.android.bundle|lib/arm64-v8a" | head -5
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: yingxu-pocket-android-release-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
