name: Build macOS release candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Test
        env:
          SMB_CONFIG_DIR: ${{ runner.temp }}/yingxu-test-config
        run: python -m unittest discover -s tests -v
      - name: Build app
        working-directory: desktop
        run: pyinstaller smb.spec --noconfirm --clean
      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "desktop/dist/影序 YINGXU.app"
      - name: Package DMG
        run: |
          mkdir dmg-root
          cp -R "desktop/dist/影序 YINGXU.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "影序 YINGXU" -srcfolder dmg-root -ov -format UDZO "YINGXU-macOS-${GITHUB_REF_NAME}.dmg"
          shasum -a 256 "YINGXU-macOS-${GITHUB_REF_NAME}.dmg" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YINGXU-macOS-${{ github.ref_name }}
          path: |
            YINGXU-macOS-*.dmg
            SHA256SUMS.txt
