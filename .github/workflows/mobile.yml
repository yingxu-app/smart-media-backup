name: Pocket mobile checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pocket:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v1
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          cache-dependency-path: mobile/pnpm-lock.yaml
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Expo package compatibility
        run: pnpm exec expo install --check
      - name: Lint, typecheck, and unit tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Generate native projects
        run: pnpm exec expo prebuild --no-install --platform all
      - name: Export Android bundle
        run: pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/yingxu-pocket-android"
      - name: Export iOS bundle
        run: pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/yingxu-pocket-ios"
        env:
          EXPO_NO_TELEMETRY: "1"

  android-debug:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v1
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          cache-dependency-path: mobile/pnpm-lock.yaml
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android project
        run: pnpm exec expo prebuild --no-install --platform android
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: yingxu-pocket-android-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v1
        with:
          version: 11.25.0
          runtime: node@24
          cache: true
          cache-dependency-path: mobile/pnpm-lock.yaml
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate iOS project
        run: pnpm exec expo prebuild --no-install --platform ios
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build iOS Simulator app
        run: >-
          xcodebuild -workspace ios/Pocket.xcworkspace -scheme Pocket
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/yingxu-pocket-derived"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
