name: Build Windows preview

on:
  push:
    branches: ["main"]
    paths: ["smb/**", "desktop/smb-win.spec", "requirements.txt", "setup.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller desktop/smb-win.spec --noconfirm
          dir dist\

      - name: Upload unsigned preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: YINGXU-Windows-unsigned-preview
          path: dist/*.exe
          if-no-files-found: error
      - name: Explain release status
        run: echo "This is an unsigned CI preview. Publish only after Windows real-device acceptance."
