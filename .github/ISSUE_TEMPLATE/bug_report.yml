name: Bug 报告
description: 扫描、备份、校验、归档记录或 Pocket 出问题时用这个
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先把真实素材、私人路径、API Key 抹掉再贴日志。没有版本号和复现步骤的报告通常没法定位。

  - type: input
    id: version
    attributes:
      label: 影序版本
      description: 设置页显示的版本号，或 Release 名称
      placeholder: 例如 v1.0.34
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 系统
      options:
        - macOS（Apple Silicon）
        - macOS（Intel）
        - Windows 11
        - Windows 10
        - iPhone Safari
        - Android
        - 其他（在补充说明里写）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从插卡开始写，越具体越好
      placeholder: |
        1. 插入 XX 卡（格式 exFAT，约 XX GB）
        2. 选择目标盘 …
        3. 点开始备份 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 脱敏后贴；归档报告可从"归档记录"里导出
      render: text
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 日志里没有真实客户素材、访问令牌、API Key 或完整私人路径
          required: true
