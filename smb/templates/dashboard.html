<!doctype html>
<html lang="zh">
<head><meta charset="UTF-8"><title>影序 YINGXU</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0a0a0b;color:#e2e8f0;min-height:100vh}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:#0f1117;padding:20px 0;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column}
.sidebar-logo{padding:0 20px 20px;font-size:16px;font-weight:700;color:#4ade80}
.sidebar a{display:block;padding:12px 20px;color:#aaa;text-decoration:none;font-size:14px;transition:.2s}
.sidebar a:hover{color:#fff;background:rgba(255,255,255,.03)}
.sidebar a.active{color:#4ade80;background:rgba(74,222,128,.08);border-right:2px solid #4ade80}
.main{flex:1;padding:30px;overflow-y:auto;max-width:900px}
.card{background:#13161a;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid rgba(255,255,255,.06)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h2,h3{color:#e2e8f0;font-weight:600}
.btn-start{display:block;width:100%;padding:14px;background:#4ade80;color:#0a0a0b;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
.btn-start:disabled{background:#1e3a2a;color:#4a6652;cursor:not-allowed}
.btn-cancel{padding:10px 24px;background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3);border-radius:8px;cursor:pointer;font-size:14px}
.btn-refresh,.btn-add-target{padding:8px 14px;background:#1a1c24;color:#4ade80;border:1px solid rgba(74,222,128,.2);border-radius:8px;cursor:pointer;font-size:14px}
.btn-refresh:hover,.btn-add-target:hover{background:rgba(74,222,128,.1)}
select,input[type=text]{padding:10px 14px;background:#1a1c24;color:#e2e8f0;border:1px solid rgba(255,255,255,.1);border-radius:8px;font-size:14px;width:100%}
.form-row{margin-bottom:16px}
.form-row label{display:block;margin-bottom:6px;color:#aaa;font-size:13px}
.hint{color:#737786;font-size:12px;margin-top:4px;display:block}
.target-selector{display:flex;gap:8px;align-items:center}
.device-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.device-icon{width:40px;height:40px;background:rgba(74,222,128,.08);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:12px}
.device-name{font-size:14px;font-weight:600}
.device-meta{font-size:12px;color:#737786}
.scan-summary{display:flex;gap:16px;padding-top:12px;color:#737786;font-size:13px;border-top:1px solid rgba(255,255,255,.04);margin-top:8px}
.progress-bar-container{display:flex;align-items:center;gap:12px;margin:16px 0}
.progress-bar{flex:1;height:6px;background:#1a1c24;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#4ade80;border-radius:3px;transition:width .3s}
.progress-pct{font-size:14px;color:#4ade80;font-weight:600;min-width:40px}
.progress-details{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-row{display:flex;justify-content:space-between;font-size:13px}
.detail-label{color:#737786}
.detail-value{color:#e2e8f0}
.target-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.target-tag{background:rgba(74,222,128,.08);color:#4ade80;padding:4px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px}
.tag-remove{background:none;border:none;color:#ef4444;cursor:pointer;font-size:12px}
.local-folder-row{display:flex;gap:8px;align-items:center}
.local-folder-row input{flex:1;padding:8px 12px;font-size:13px}
.status-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:16px;background:#13161a;border-radius:12px;border:1px solid rgba(255,255,255,.06)}
.status-icon{font-size:28px}
.status-title{font-size:15px;font-weight:600}
.status-detail{font-size:13px;color:#737786}
</style></head>
<body><div class="app">
<div class="sidebar">
  <div class="sidebar-logo">影序 YINGXU</div>
  <a href="/" class="active">01 工作台</a>
  <a href="/history">02 归档记录</a>
  <a href="/settings">03 偏好设置</a>
</div>
<div class="main" id="mainContent">
<div class="status-bar" id="statusBar">
  <div class="status-icon" id="statusIcon">📡</div>
  <div class="status-info">
    <div class="status-title" id="statusTitle">等待插入 SD 卡...</div>
    <div class="status-detail" id="statusDetail">插入 SD 卡后自动检测</div>
  </div>
</div>
<div class="scan-result card" id="scanResult" style="display:none">
  <div class="card-header"><h3>📷 检测结果</h3><span class="card-subtitle" id="cardSubtitle"></span></div>
  <div class="device-list" id="deviceList"></div>
  <div class="scan-summary"><span id="totalFilesInfo"></span><span id="totalSizeInfo"></span></div>
</div>
<div class="action-panel card" id="actionPanel" style="display:none">
  <div class="form-row">
    <label for="eventName">📝 事件名称</label>
    <input type="text" id="eventName" placeholder="例如：2026年上海漫展">
  </div>
  <div class="form-row">
    <label>💾 备份到</label>
    <div class="target-selector">
      <select id="backupTarget"></select>
      <button class="btn-refresh" onclick="refreshTargets()" title="刷新磁盘">🔄</button>
      <button class="btn-add-target" onclick="addTarget()">＋</button>
    </div>
    <div class="local-folder-row" style="margin-top:6px">
      <input type="text" id="localFolder" placeholder="或输入本地路径，如 /Users/nanyu/Desktop/备份">
      <button class="btn-add-target" onclick="setLocalFolder()">📁 设为目标</button>
    </div>
    <div id="targetTags" class="target-tags"></div>
    <small class="hint">可选手动输入本地路径，或从下拉选外置磁盘。点＋添加额外备份目标</small>
  </div>
  <button class="btn-start" id="btnStart" onclick="startBackup()" disabled>▶ 开始备份</button>
</div>
<div class="progress-panel card" id="progressPanel" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h3 id="progressTitle">📤 正在备份...</h3>
    <button class="btn-cancel" onclick="cancelBackup()">✕ 取消</button>
  </div>
  <div class="progress-bar-container">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-pct" id="progressPct">0%</div>
  </div>
  <div class="progress-details">
    <div class="detail-row"><span class="detail-label">当前文件</span><span class="detail-value" id="currentFile">—</span></div>
    <div class="detail-row"><span class="detail-label">速度</span><span class="detail-value" id="currentSpeed">—</span></div>
    <div class="detail-row"><span class="detail-label">已复制</span><span class="detail-value" id="copiedCount">0</span></div>
    <div class="detail-row"><span class="detail-label">已跳过</span><span class="detail-value" id="skippedCount">0</span></div>
  </div>
</div>
</div></div>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
const socket=io();let detectedMount='';let extraTargets=[];

socket.on('scan_progress',d=>{document.getElementById('progressFill').style.width=d.progress+'%';document.getElementById('progressPct').textContent=Math.round(d.progress)+'%';document.getElementById('currentFile').textContent=d.current_file||'—';document.getElementById('currentSpeed').textContent=d.speed||'—';document.getElementById('copiedCount').textContent=d.copied||0;document.getElementById('skippedCount').textContent=d.skipped||0});
socket.on('backup_complete',d=>{alert('✅ 备份完成! '+d.copied+' 个文件已复制, '+d.skipped+' 个已跳过');resetUI();});
socket.on('backup_error',d=>{alert('❌ 备份出错: '+d.error);resetUI();});
socket.on('scan_update',d=>{detectedMount=d.mount_point;renderScan(d.devices,d.total_files,d.total_size)});

function scan(){fetch('/api/scan').then(r=>r.json()).then(d=>{detectedMount=d.mount_point;renderScan(d.devices,d.total_files,d.total_size)}).catch(e=>{document.getElementById('statusTitle').textContent='等待插入 SD 卡...';document.getElementById('statusDetail').textContent='插入后自动检测'})}

function renderScan(devices,total,size){if(!devices||devices.length===0){document.getElementById('statusTitle').textContent='未检测到设备';return}document.getElementById('statusTitle').textContent='✅ 检测到 '+devices.length+' 个设备';document.getElementById('statusDetail').textContent='';document.getElementById('scanResult').style.display='block';document.getElementById('actionPanel').style.display='block';document.getElementById('btnStart').disabled=false;let h='';devices.forEach(d=>{let pc=d.photo_count||d.files.filter(f=>['.jpg','.jpeg','.png','.heic'].some(e=>f.name.toLowerCase().endsWith(e))).length;let vc=d.video_count||d.files.filter(f=>['.mp4','.mov','.avi'].some(e=>f.name.toLowerCase().endsWith(e))).length;h+=`<div class="device-row"><div class="device-icon">📷</div><div><div class="device-name">${d.name||'Unknown'}</div><div class="device-meta">${d.file_count||d.files.length} 文件 · ${pc} 照片 · ${vc} 视频</div></div></div>`});document.getElementById('deviceList').innerHTML=h;document.getElementById('totalFilesInfo').textContent='共 '+total+' 个文件';document.getElementById('totalSizeInfo').textContent=(size/(1024*1024)).toFixed(1)+' MB';document.getElementById('cardSubtitle').textContent='扫描完成'}

function refreshTargets(){fetch('/api/volumes').then(r=>r.json()).then(vols=>{let sel=document.getElementById('backupTarget');sel.innerHTML='';if(vols.length===0){sel.innerHTML='<option value="">没有检测到磁盘</option>';return}sel.innerHTML='<option value="">选择目标磁盘...</option>';vols.forEach(v=>{sel.innerHTML+=`<option value="${v.mount_point}">${v.name||'—'} (${v.mount_point}) — ${(v.size_free/(1024**3)).toFixed(1)} GB 可用</option>`})})}

function setLocalFolder(){let p=document.getElementById('localFolder').value.trim();if(!p){alert('请输入路径');return}document.getElementById('backupTarget').innerHTML=`<option value="${p}" selected>📁 ${p}</option>`;document.getElementById('btnStart').disabled=false}

function addTarget(){let sel=document.getElementById('backupTarget');let v=sel.value;if(!v||extraTargets.includes(v))return;extraTargets.push(v);renderTags()}
function removeTarget(v){extraTargets=extraTargets.filter(t=>t!==v);renderTags()}
function renderTags(){document.getElementById('targetTags').innerHTML=extraTargets.map(t=>`<span class="target-tag">${t.split('/').pop()||t} <button onclick="removeTarget('${t}')" class="tag-remove">✕</button></span>`).join('')}

function startBackup(){let sel=document.getElementById('backupTarget');let back=sel.value;if(!back){alert('请选择或输入备份目标位置');return}let evt=document.getElementById('eventName').value.trim();if(!evt){alert('请输入事件名称');return}if(extraTargets.length===0){extraTargets=[back]}document.getElementById('progressPanel').style.display='block';document.getElementById('actionPanel').style.display='none';document.getElementById('scanResult').style.display='none';fetch('/api/start_backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mount_point:detectedMount,event_name:evt,backup_root:back,backup_targets:extraTargets})})}

function cancelBackup(){fetch('/api/cancel_backup',{method:'POST'});resetUI()}
function resetUI(){document.getElementById('progressPanel').style.display='none';document.getElementById('scanResult').style.display='none';document.getElementById('actionPanel').style.display='none';extraTargets=[];renderTags()}

refreshTargets();setInterval(scan,3000);
</script></body></html>
